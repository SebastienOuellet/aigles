<!doctype html>
<html lang="fr-CA">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Tirage – Billets Canadiens</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root{--rouge:#af1e2d;--bleu:#192168;--fond:#f4f5f8;--carte:#fff;--texte:#1b1d29;--gris:#6b7080;--bord:#dfe2ea;--ok:#1d7a46}
        *{box-sizing:border-box}
        body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--texte);-webkit-font-smoothing:antialiased}
        header{background:var(--bleu);color:#fff;padding:24px 16px 60px;text-align:center;border-bottom:6px solid var(--rouge)}
        header h1{margin:0;font-size:1.5rem;letter-spacing:.01em}
        header p{margin:6px 0 0;opacity:.85}
        main{max-width:520px;margin:-44px auto 32px;padding:0 16px}
        .carte{background:var(--carte);border-radius:14px;box-shadow:0 4px 18px rgba(20,25,60,.08);padding:20px;margin-bottom:16px}
        .infos{display:flex;gap:10px}
        .info{flex:1;background:var(--fond);border-radius:10px;padding:10px 12px}
        .info small{display:block;color:var(--gris);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
        .info strong{font-size:1.05rem}
        label{display:block;font-weight:600;margin:18px 0 6px}
        input,select{width:100%;padding:12px;font-size:1rem;border:1.5px solid var(--bord);border-radius:10px;background:#fff;color:inherit}
        input:focus,select:focus{outline:none;border-color:var(--bleu)}
        .qtes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
        .qtes button{padding:12px 0;font-size:1.1rem;font-weight:700;border:1.5px solid var(--bord);border-radius:10px;background:#fff;color:var(--texte);cursor:pointer}
        .qtes button.actif{background:var(--bleu);border-color:var(--bleu);color:#fff}
        #autreWrap{margin-top:8px;display:none}
        .total{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding:14px 16px;background:var(--fond);border-radius:10px}
        .total span{color:var(--gris)}
        .total strong{font-size:1.5rem;color:var(--rouge)}
        .btn{display:block;width:100%;margin-top:12px;padding:15px;font-size:1.05rem;font-weight:700;border:0;border-radius:12px;background:var(--rouge);color:#fff;cursor:pointer}
        .btn:disabled{opacity:.55;cursor:wait}
        .btn.sec{background:#fff;color:var(--bleu);border:1.5px solid var(--bleu)}
        .lien{background:none;border:0;color:var(--bleu);text-decoration:underline;cursor:pointer;font-size:.9rem;margin-top:12px;padding:0}
        .msg{margin-top:14px;padding:12px;border-radius:10px;font-size:.95rem;display:none}
        .msg.err{display:block;background:#fdecee;color:var(--rouge)}
        .msg.info{display:block;background:#eef0fb;color:var(--bleu)}
        .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
        .chargement{text-align:center;color:var(--gris);padding:30px 0}

        /* Reçu */
        #recu{background:#fff;border-radius:14px;padding:22px;border:2px dashed var(--bleu)}
        #recu h2{margin:0 0 2px;color:var(--bleu);font-size:1.25rem}
        #recu .sous{color:var(--gris);font-size:.9rem;margin-bottom:14px}
        .ligne{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bord);font-size:.95rem}
        .ligne span{color:var(--gris)}
        .billets{margin:14px 0 4px;border-collapse:collapse;width:100%}
        .billets th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);padding:6px 4px}
        .billets td{padding:9px 4px;border-top:1px solid var(--bord)}
        .billets td:first-child{font-weight:700;width:64px}
        .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.05rem;letter-spacing:.06em;font-weight:700;color:var(--rouge)}
        .pied{margin-top:12px;font-size:.8rem;color:var(--gris);text-align:center}
        .ok{color:var(--ok);font-weight:700;text-align:center;margin:0 0 14px}
        .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
        .actions .btn{margin-top:0;font-size:.95rem;padding:13px}
        .actions .large{grid-column:1/-1}

        @media print{
            header,#vueForm,.actions,.ok,.lien{display:none!important}
            body{background:#fff}
            main{margin:0;max-width:none}
            .carte{box-shadow:none;padding:0}
        }
    </style>
</head>
<body>
<header>
    <h1 id="titre">Tirage – Billets Canadiens</h1>
    <p>Achat de billets de tirage</p>
</header>

<main>
    <!-- Formulaire -->
    <section id="vueForm" class="carte">
        <div id="chargement" class="chargement">Chargement…</div>

        <form id="form" novalidate hidden>
            <div class="infos">
                <div class="info"><small>Prix / billet</small><strong id="prix">–</strong></div>
                <div class="info"><small>Date du tirage</small><strong id="dateTirage">–</strong></div>
            </div>

            <label for="joueur">Au profit de (joueur)</label>
            <select id="joueur" required>
                <option value="">— Choisir un joueur —</option>
            </select>

            <label for="nom">Nom complet</label>
            <input id="nom" autocomplete="name" maxlength="80" required>

            <label for="tel">Téléphone</label>
            <input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(819) 555-1234" required>

            <label>Nombre de billets</label>
            <div class="qtes" id="qtes"></div>
            <div id="autreWrap">
                <input id="autre" type="number" inputmode="numeric" min="6" max="10" placeholder="Nombre de billets (6 et plus)">
            </div>

            <!-- honeypot anti-bot -->
            <div class="hp" aria-hidden="true"><input id="website" tabindex="-1" autocomplete="off"></div>

            <div class="total"><span>Total</span><strong id="total">–</strong></div>

            <button class="btn" id="btnCommander" type="submit">Commander</button>
            <div class="msg" id="msg"></div>
        </form>

        <button class="lien" id="btnDerniere" type="button" hidden>Afficher ma dernière commande</button>
    </section>

    <!-- Confirmation -->
    <section id="vueRecu" class="carte" hidden>
        <p class="ok">✔ Commande enregistrée</p>
        <div id="recu"></div>
        <p class="pied" style="margin:12px 0">Conserve cette preuve : fais une capture d'écran ou télécharge l'image.</p>
        <div class="actions">
            <button class="btn large" id="btnImage" type="button">Télécharger l'image</button>
            <button class="btn sec" id="btnPartager" type="button" hidden>Partager</button>
            <button class="btn sec" id="btnCopier" type="button">Copier le texte</button>
            <button class="btn sec" id="btnImprimer" type="button">Imprimer / PDF</button>
            <button class="btn sec large" id="btnNouvelle" type="button">Nouvelle commande</button>
        </div>
    </section>
</main>

<script>
    /* ====== CONFIG ====== */
    const API_URL = 'https://script.google.com/macros/s/AKfycbykcmTL6uIcOZRLrFERCLPEedM-r7JyB6uXdnM2bfIadnz_SGC6KEWUqT8g4xrAwgyWrQ/exec';   // https://script.google.com/macros/s/XXXX/exec
    const TITRE   = 'Tirage – Billets Canadiens';
    const QTES_RAPIDES = [1, 2, 3, 4, 5];
    const MAX_BILLETS = 400;
    const LS_KEY = 'tirage_derniere_commande';
    /* ==================== */

    const $ = id => document.getElementById(id);
    let cfg = null, qte = 1, autreActif = false, requestId = null, recu = null;

    const argent = n => Number(n).toLocaleString('fr-CA', { style: 'currency', currency: 'CAD' });
    const dateFr = iso => {
        if (!iso) return '—';
        const [y, m, d] = iso.split('-').map(Number);
        return new Date(y, m - 1, d).toLocaleDateString('fr-CA', { day: 'numeric', month: 'long', year: 'numeric' });
    };
    const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
    const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch { return null; } };
    const lsSet = v => { try { localStorage.setItem(LS_KEY, JSON.stringify(v)); } catch {} };

    function msg(texte, type = 'err') {
        const el = $('msg');
        el.className = 'msg ' + (texte ? type : '');
        el.textContent = texte || '';
    }

    /* ---------- Init ---------- */
    document.title = TITRE;
    $('titre').textContent = TITRE;

    async function init() {
        if (lsGet()) $('btnDerniere').hidden = false;
        try {
            const r = await fetch(API_URL + '?action=config');
            cfg = await r.json();
            if (!cfg.ok) throw new Error(cfg.error || 'Erreur de configuration');
        } catch (e) {
            $('chargement').textContent = 'Impossible de charger le formulaire. Réessaie plus tard.';
            return;
        }

        $('prix').textContent = argent(cfg.cout);
        $('dateTirage').textContent = dateFr(cfg.dateTirage);

        const sel = $('joueur');
        cfg.joueurs.forEach(j => sel.add(new Option(j, j)));
        const pre = new URLSearchParams(location.search).get('joueur');
        if (pre) {
            const match = cfg.joueurs.find(j => norm(j) === norm(pre));
            if (match) sel.value = match;
        }

        const qtes = $('qtes');
        QTES_RAPIDES.forEach(n => {
            const b = document.createElement('button');
            b.type = 'button'; b.textContent = n; b.dataset.q = n;
            qtes.appendChild(b);
        });
        const bAutre = document.createElement('button');
        bAutre.type = 'button'; bAutre.textContent = '+'; bAutre.dataset.q = 'autre';
        bAutre.title = 'Plus de 5';
        qtes.appendChild(bAutre);
        qtes.addEventListener('click', e => {
            const b = e.target.closest('button'); if (!b) return;
            if (b.dataset.q === 'autre') { autreActif = true; $('autreWrap').style.display = 'block'; $('autre').focus(); }
            else { autreActif = false; qte = Number(b.dataset.q); $('autreWrap').style.display = 'none'; }
            majQte();
        });
        $('autre').addEventListener('input', majQte);

        $('chargement').hidden = true;
        $('form').hidden = false;

        if (!cfg.ouvert) {
            msg('La vente de billets est terminée.', 'info');
            $('btnCommander').disabled = true;
        }
        majQte();
    }

    function quantite() {
        return autreActif ? parseInt($('autre').value, 10) || 0 : qte;
    }

    function majQte() {
        [...$('qtes').children].forEach(b => {
            b.classList.toggle('actif', autreActif ? b.dataset.q === 'autre' : Number(b.dataset.q) === qte);
        });
        const q = quantite();
        $('total').textContent = q > 0 ? argent(q * cfg.cout) : '–';
        requestId = null; // la commande a changé → nouvel identifiant de requête
    }

    /* ---------- Téléphone : masque ---------- */
    $('tel').addEventListener('input', e => {
        let d = e.target.value.replace(/\D/g, '');
        if (d.length === 11 && d[0] === '1') d = d.slice(1);
        d = d.slice(0, 10);
        let out = d;
        if (d.length > 6) out = `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
        else if (d.length > 3) out = `(${d.slice(0,3)}) ${d.slice(3)}`;
        else if (d.length > 0) out = `(${d}`;
        e.target.value = out;
    });

    /* ---------- Soumission ---------- */
    $('form').addEventListener('submit', async e => {
        e.preventDefault();
        msg('');
        const nom = $('nom').value.trim();
        const tel = $('tel').value.replace(/\D/g, '');
        const joueur = $('joueur').value;
        const q = quantite();

        if (!joueur) return msg('Choisis le joueur.');
        if (nom.length < 3) return msg('Entre ton nom complet.');
        if (tel.length !== 10) return msg('Le téléphone doit contenir 10 chiffres.');
        if (!q || q < 1 || q > MAX_BILLETS) return msg(`Nombre de billets invalide (1 à ${MAX_BILLETS}).`);

        if (!confirm(`Confirmer ${q} billet${q > 1 ? 's' : ''} pour ${argent(q * cfg.cout)} ?`)) return;

        requestId = requestId || uuid();
        const btn = $('btnCommander');
        btn.disabled = true; btn.textContent = 'Enregistrement…';

        try {
            // Pas de header Content-Type → text/plain → pas de preflight CORS avec Apps Script
            const r = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ nom, telephone: tel, joueur, quantite: q, requestId, website: $('website').value })
            });
            const res = await r.json();
            if (!res.ok) throw new Error(res.error || 'Erreur inconnue');
            lsSet(res);
            afficherRecu(res);
        } catch (err) {
            msg(err.message === 'Failed to fetch'
                ? 'Problème de connexion. Réessaie — tu ne seras pas facturé en double.'
                : err.message);
        } finally {
            btn.disabled = !cfg.ouvert; btn.textContent = 'Commander';
        }
    });

    /* ---------- Reçu ---------- */
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function afficherRecu(res) {
        recu = res;
        const lignes = res.billets.map(b =>
            `<tr><td>#${String(b.numero).padStart(3, '0')}</td><td class="code">${esc(b.code)}</td></tr>`).join('');
        $('recu').innerHTML = `
    <h2>${esc(TITRE)}</h2>
    <div class="sous">Preuve d'achat – commande ${esc(res.commande)}</div>
    <div class="ligne"><span>Acheteur</span><strong>${esc(res.nom)}</strong></div>
    <div class="ligne"><span>Téléphone</span><strong>${esc(res.telephone)}</strong></div>
    <div class="ligne"><span>Au profit de</span><strong>${esc(res.joueur)}</strong></div>
    <div class="ligne"><span>Date du tirage</span><strong>${dateFr(res.dateTirage)}</strong></div>
    <div class="ligne"><span>${res.quantite} × ${argent(res.cout)}</span><strong>${argent(res.total)}</strong></div>
    <table class="billets">
      <thead><tr><th>Billet</th><th>Code unique</th></tr></thead>
      <tbody>${lignes}</tbody>
    </table>
    <div class="pied">Présente ce code en cas de gain. Bonne chance !</div>`;
        $('vueForm').hidden = true;
        $('vueRecu').hidden = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function texteRecu(r) {
        return [
            TITRE,
            `Acheteur : ${r.nom}`,
            `Au profit de : ${r.joueur}`,
            `Tirage : ${dateFr(r.dateTirage)}`,
            `Billets (${r.quantite}) :`,
            ...r.billets.map(b => `  #${String(b.numero).padStart(3, '0')} — ${b.code}`),
            `Total : ${argent(r.total)}`,
            `Commande : ${r.commande}`
        ].join('\n');
    }

    async function imageRecu() {
        const canvas = await html2canvas($('recu'), { scale: 2, backgroundColor: '#ffffff' });
        return new Promise(res => canvas.toBlob(res, 'image/png'));
    }

    $('btnImage').addEventListener('click', async () => {
        const blob = await imageRecu();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `billets-${recu.commande}.png`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });

    if (navigator.share) {
        $('btnPartager').hidden = false;
        $('btnPartager').addEventListener('click', async () => {
            try {
                const blob = await imageRecu();
                const file = new File([blob], `billets-${recu.commande}.png`, { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: TITRE, text: texteRecu(recu) });
                } else {
                    await navigator.share({ title: TITRE, text: texteRecu(recu) });
                }
            } catch { /* annulé */ }
        });
    }

    $('btnCopier').addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(texteRecu(recu));
            $('btnCopier').textContent = 'Copié ✔';
            setTimeout(() => $('btnCopier').textContent = 'Copier le texte', 1800);
        } catch { alert(texteRecu(recu)); }
    });

    $('btnImprimer').addEventListener('click', () => window.print());

    $('btnNouvelle').addEventListener('click', () => {
        $('vueRecu').hidden = true;
        $('vueForm').hidden = false;
        $('form').hidden = false;
        $('nom').value = ''; $('tel').value = ''; $('autre').value = '';
        autreActif = false; qte = 1; $('autreWrap').style.display = 'none';
        $('btnDerniere').hidden = false;
        msg(''); majQte();
    });

    $('btnDerniere').addEventListener('click', () => {
        const r = lsGet();
        if (r) afficherRecu(r);
    });

    init();
</script>
</body>
</html>
